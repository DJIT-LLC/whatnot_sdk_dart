name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Puro
        run: |
          curl -s https://puro.dev/install.sh | bash
          echo "$HOME/.puro/bin" >> $GITHUB_PATH

      - name: Setup Dart Environment with Puro
        run: |
          puro create default stable
          puro use default

      - name: Install dependencies
        run: puro dart pub get

      - name: Check Formatting
        run: puro dart run melos run format

      - name: Run Static Analysis
        run: puro dart run melos run analyze

      - name: Run Unit Tests
        run: puro dart run melos run test
