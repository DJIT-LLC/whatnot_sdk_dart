name: Check Whatnot Upstreams (OpenAPI & Taxonomy)

on:
  schedule:
    # Run every Monday at 08:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-upstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Puro
        run: |
          curl -s https://puro.dev/install.sh | bash
          echo "$HOME/.puro/bin" >> $GITHUB_PATH

      - name: Setup Dart Environment with Puro
        run: |
          puro create default stable
          puro use default

      - name: Install dependencies
        run: puro dart pub get

      - name: Check Upstream Changes
        run: puro dart run melos run check:upstreams
