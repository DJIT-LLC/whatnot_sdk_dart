name: whatnot_seller_api
description: A Dart SDK for the Whatnot Seller REST v2 API generated from the official OpenAPI spec, with rate-limiting retry and HMAC-SHA256 Webhook handling.
version: 0.1.0
repository: https://github.com/DJIT-LLC/whatnot_sdk_dart
issue_tracker: https://github.com/DJIT-LLC/whatnot_sdk_dart/issues

resolution: workspace

environment:
  sdk: '^3.13.0'

dependencies:
  crypto: ^3.0.3
  http: ^1.2.0
  meta: ^1.15.0

dev_dependencies:
  analyzer_buffer: ^0.3.0
  lints: ^5.0.0
  test: ^1.25.0
